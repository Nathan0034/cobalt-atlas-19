<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>顧客名單後台 | BROOKLYN HUNTINGTON</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Helvetica, Arial, sans-serif; background: #f5f5f3; color: #111; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 2rem 1.5rem; }
  h1 { font-size: 18px; letter-spacing: 1px; margin: 0 0 1.5rem; }

  #loginPanel { max-width: 320px; margin: 4rem auto; }
  #loginPanel input {
    width: 100%; padding: 10px; margin-bottom: 12px;
    border: 1px solid #ccc; font-family: inherit; font-size: 14px;
  }
  #loginPanel button {
    width: 100%; padding: 12px; background: #111; color: #fff; border: none;
    font-family: inherit; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer;
  }
  #loginError { color: #b23b3b; font-size: 12px; margin-top: 8px; }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
  .toolbar .actions { display: flex; gap: 10px; align-items: center; }
  .toolbar a, .toolbar button {
    font-family: inherit; font-size: 12px; letter-spacing: 1px; color: #111;
    background: #fff; border: 1px solid #ccc; padding: 8px 14px; cursor: pointer; text-decoration: none;
  }
  .status { font-size: 11px; color: #9b9b9b; }

  table { width: 100%; border-collapse: collapse; background: #fff; font-size: 13px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #eee; white-space: nowrap; }
  th { font-size: 11px; letter-spacing: 1px; color: #6a6a6a; text-transform: uppercase; }
  tr.processed { opacity: 0.4; }
  .table-scroll { overflow-x: auto; background: #fff; }
  .empty { padding: 3rem; text-align: center; color: #9b9b9b; font-size: 13px; }
</style>
</head>
<body>

<div id="loginPanel" class="wrap">
  <h1>顧客名單後台登入</h1>
  <input type="password" id="staffPassword" placeholder="密碼">
  <button id="loginBtn">登入</button>
  <div id="loginError" class="hidden"></div>
</div>

<div id="dashboard" class="wrap hidden">
  <h1>顧客名單後台</h1>
  <div class="toolbar">
    <span class="status" id="statusText"></span>
    <div class="actions">
      <a href="/api/staff/export.csv">匯出 CSV</a>
      <button id="logoutBtn">登出</button>
    </div>
  </div>
  <div class="table-scroll">
    <table id="table">
      <thead>
        <tr>
          <th>時間</th>
          <th>姓名</th>
          <th>性別</th>
          <th>電話</th>
          <th>生日</th>
          <th>Email</th>
          <th>地址</th>
          <th>語言</th>
          <th>已登錄</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div id="emptyState" class="empty hidden">目前還沒有顧客提交資料</div>
  </div>
</div>

<script src="staff.js"></script>
</body>
</html>
